name: release

# Publishes a provenance-attested GitHub Release on SemVer tag push (avd-ops ADR 0029).
on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    uses: avd-ops/avd-ops/.github/workflows/reusable-release.yml@main
    with:
      default-branch: 'main'
    permissions:
      contents: write
      id-token: write
      attestations: write